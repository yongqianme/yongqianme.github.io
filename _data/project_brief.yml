en:
  intro: "A short brief helps me understand fit before we discuss scope. Required fields are marked (required)."
  name: "Your name (required)"
  email: "Work email (required)"
  company: "Company / team (required)"
  location: "Site location / time zone"
  problem: "Process and problem (required)"
  problem_help: "What is happening, which process is affected, and what have you already tried?"
  impact: "Business impact"
  impact_help: "For example: downtime, scrap, cycle-time variation, or acceptance delays. An estimate is fine."
  deadline: "Decision deadline"
  budget: "Budget / decision owner"
  data: "Available information"
  data_help: "For example: fault logs, cycle-time records, or an existing test plan. Describe what is available; do not upload it here."
  privacy: "This tool prepares a draft in your browser. Nothing is submitted by the form. Review and send it through your email app. Please keep confidential production data out of this initial brief."
  prepare: "Prepare email draft"
  result: "Review your project brief"
  draft_label: "Email draft"
  send: "Open draft in email app"
  copy: "Copy brief"
  result_help: "Nothing has been sent. Open the draft in your email app, or copy it and email qianyong@qianyong.me. If your email app truncates the draft, paste the full brief below."
  ready: "Your draft is ready to review. Nothing has been sent."
  copied: "Brief copied. Paste it into an email to qianyong@qianyong.me."
  copy_failed: "Select and copy the draft below, then email it to qianyong@qianyong.me."
  subject: "Robotics project inquiry"
  no_js: "To share a brief, email your name, company, process, problem, and deadline to qianyong@qianyong.me. You can also book an introduction using the calendar link above."
zh:
  intro: "简短的项目说明有助于判断合作是否合适。标注“必填”的内容需要填写。"
  name: "您的姓名（必填）"
  email: "工作邮箱（必填）"
  company: "公司 / 团队（必填）"
  location: "现场所在地 / 时区"
  problem: "工艺与问题（必填）"
  problem_help: "发生了什么、影响哪个工艺，以及已经尝试过哪些措施？"
  impact: "业务影响"
  impact_help: "例如停机、报废、节拍波动或验收延迟。可以提供估算。"
  deadline: "决策时间要求"
  budget: "预算 / 决策负责人"
  data: "已有信息"
  data_help: "例如故障日志、节拍记录或现有测试方案。只需说明有哪些资料，无需在此上传。"
  privacy: "此工具只在浏览器中生成草稿，表单不会提交任何内容。请在邮件应用中审核并发送。初次简报请勿包含生产机密数据。"
  prepare: "生成邮件草稿"
  result: "审核项目简报"
  draft_label: "邮件草稿"
  send: "在邮件应用中打开草稿"
  copy: "复制简报"
  result_help: "尚未发送任何内容。请在邮件应用中打开草稿，或复制后发送至 qianyong@qianyong.me。如果邮件应用截断内容，请粘贴下方完整简报。"
  ready: "草稿已生成，请审核。尚未发送。"
  copied: "已复制。请粘贴到邮件中并发送至 qianyong@qianyong.me。"
  copy_failed: "请选中并复制下方草稿，然后发送至 qianyong@qianyong.me。"
  subject: "机器人项目咨询"
  no_js: "请将姓名、公司、工艺、问题和时间要求发送至 qianyong@qianyong.me，也可以通过上方日程链接预约沟通。"
