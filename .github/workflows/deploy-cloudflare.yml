name: Deploy site to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-demo
  cancel-in-progress: false

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace --config _config.yml,_config.cloudflare.yml
        env:
          JEKYLL_ENV: production

      - name: Add Cloudflare response headers
        run: cp cloudflare-site/headers _site/_headers

      - name: Assert private and development files are absent
        run: |
          test ! -e _site/cloudflare-submission-form
          test ! -e _site/_plans
          test ! -e _site/test
          test ! -e _site/scripts
          ! grep -R "localhost:4000" _site --include='*.html'

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          packageManager: npm
          command: deploy --config wrangler.jsonc
